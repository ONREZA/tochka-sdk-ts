name: Sync OpenAPI

on:
  schedule:
    # Ежедневно в 03:00 UTC (06:00 МСК)
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-openapi
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      LEFTHOOK: 0
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - run: bun install --frozen-lockfile

      - name: Sync spec and regenerate types
        id: sync
        run: |
          set +e
          bun run spec:sync
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 100 ]; then
            echo "no_changes=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -ne 0 ]; then
            exit $code
          fi

      - name: Verify repository
        run: bun run verify

      - name: Create Pull Request
        if: steps.sync.outputs.no_changes != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: sync/openapi
          title: "chore(spec): sync OpenAPI specifications"
          body-path: .sync-report.md
          commit-message: "chore(spec): sync OpenAPI specifications"
          labels: |
            spec-sync
            autogenerated
          delete-branch: true
