name: Sync OpenAPI

on:
  schedule:
    # Ежедневно в 03:00 UTC (06:00 МСК)
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-openapi
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      LEFTHOOK: 0
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Require event-triggering token
        if: github.ref == 'refs/heads/main'
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo "::error::Organization secret RELEASE_PLEASE_TOKEN is required"
            exit 1
          fi

      - run: bun install --frozen-lockfile

      - name: Sync spec and regenerate types
        id: sync
        env:
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/tools/certs/russian-trusted-root-ca.pem
        run: |
          set +e
          bun run spec:sync
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 100 ]; then
            echo "no_changes=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -ne 0 ]; then
            exit $code
          fi

      - name: Verify repository
        id: verify
        continue-on-error: true
        run: bun run verify

      - name: Include verification failure in sync report
        if: steps.verify.outcome == 'failure' && steps.sync.outputs.no_changes != 'true'
        run: |
          cat >> .sync-report.md <<'EOF'

          ## Verification failed

          This update requires SDK changes before it can be merged. This PR is a draft;
          repository validation remains a required manual review gate.
          See [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          EOF

      - name: Create Pull Request
        if: github.ref == 'refs/heads/main' && steps.sync.outputs.no_changes != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          branch: sync/openapi
          title: "chore(spec): sync OpenAPI specifications"
          body-path: .sync-report.md
          commit-message: "chore(spec): sync OpenAPI specifications"
          draft: ${{ steps.verify.outcome == 'failure' && 'always-true' || 'false' }}
          labels: |
            spec-sync
            autogenerated
          delete-branch: true

      - name: Fail when repository verification failed
        if: steps.verify.outcome == 'failure'
        run: exit 1
