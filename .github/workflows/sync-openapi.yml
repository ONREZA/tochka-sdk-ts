name: Sync OpenAPI

on:
  schedule:
    # Ежедневно в 03:00 UTC (06:00 МСК)
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-openapi
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    env:
      LEFTHOOK: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Require event-triggering token
        if: github.ref == 'refs/heads/main'
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo "::error::Organization secret RELEASE_PLEASE_TOKEN is required"
            exit 1
          fi

      - run: bun install --frozen-lockfile

      - name: Sync spec and regenerate types
        id: sync
        env:
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/tools/certs/russian-trusted-root-ca.pem
        run: |
          set +e
          bun run spec:sync
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 100 ]; then
            echo "no_changes=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -ne 0 ]; then
            exit $code
          fi

      - name: Create Pull Request
        if: github.ref == 'refs/heads/main' && steps.sync.outputs.no_changes != 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          branch: sync/openapi
          title: "chore(spec): sync OpenAPI specifications"
          body-path: .sync-report.md
          commit-message: "chore(spec): sync OpenAPI specifications"
          labels: |
            spec-sync
            autogenerated
          delete-branch: true
