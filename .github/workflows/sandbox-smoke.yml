name: Sandbox smoke

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: sandbox-smoke
  cancel-in-progress: false

jobs:
  sandbox:
    runs-on: ubuntu-latest
    env:
      TOCHKA_SMOKE: 1
      TOCHKA_MODE: sandbox
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - run: bun install --frozen-lockfile
      - run: bun test packages/tochka-sdk/test/sandbox
