name: Sandbox smoke

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandbox-smoke
  cancel-in-progress: false

jobs:
  sandbox:
    runs-on: ubuntu-latest
    env:
      TOCHKA_SMOKE: 1
      TOCHKA_MODE: sandbox
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - run: bun install --frozen-lockfile
      - name: Run sandbox smoke tests
        env:
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/tools/certs/russian-trusted-root-ca.pem
        run: bun test packages/tochka-sdk/test/sandbox
