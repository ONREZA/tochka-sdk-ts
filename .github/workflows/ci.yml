name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - run: bun install --frozen-lockfile

      - name: Verify repository
        run: bun run verify

  deno-runtime:
    name: Deno
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: denoland/setup-deno@v2

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: |
          deno eval '
            const entries = ["index", "webhooks", "pay-gateway", "errors"];
            await Promise.all(entries.map((entry) =>
              import("./packages/tochka-sdk/dist/" + entry + ".js")
            ));
          '

  commitlint:
    name: Lint Commit Messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify commits
        # Lint only the commits introduced by this PR, not pre-existing history
        # on the base branch (which may predate Conventional Commits enforcement).
        uses: cocogitto/cocogitto-action@v4
        with:
          command: check
          args: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
