version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Generators and declaration emit still need the TypeScript 6 compiler API.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
